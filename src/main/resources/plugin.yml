name: CreativeGate
version: '0.1.6-thecivia'
main: org.tamasoft.creativegate.CreativeGate
api-version: 1.19
softdepend: [ PvPManager ]
prefix: "[CreativeGate]"
authors: [ Error110 ]
description: A plugin that allows you to create teleportation gates without running a single command

permissions:
  CreativeGates.1:
    description: Allows the player to use the gates
    default: true
  CreativeGates.2:
    description: Allows the player to use the gates
    default: op
  CreativeGates.3:
    description: Allows the player to use the gates
    default: op
  CreativeGates.4:
    description: Allows the player to use the gates
    default: op
  CreativeGates.5:
    description: Allows the player to use the gates
    default: op
  CreativeGates.6:
    description: Allows the player to use the gates
    default: op
  CreativeGates.7:
    description: Allows the player to use the gates
    default: op
  CreativeGates.8:
    description: Allows the player to use the gates
    default: op
  CreativeGates.9:
    description: Allows the player to use the gates
    default: op
  CreativeGates.10:
    description: Allows the player to use the gates
    default: op
  creativegates.network.bypass:
    description: Add gates to networks owned by other players (only checked when networkOwnership is enabled)
    default: op
  creativegates.mode.bypass:
    description: Change the enter/exit mode of gates of other players
    default: op
  creativegates.combat.bypass:
    description: Enter gates while in combat or right after taking damage
    default: op
